<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect & Review — TapToReview.in</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="icon" href="/assets/taptoreview-logo.svg" type="image/svg+xml">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: radial-gradient(circle at top, #141c2b 0%, #0a0e17 100%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
    }
    .landing-card {
      width: 100%;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(212, 175, 55, 0.28);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 24px;
      padding: 34px 22px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #d4af37;
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid rgba(212, 175, 55, 0.25);
      padding: 5px 14px;
      border-radius: 999px;
      margin-bottom: 18px;
    }
    .biz-name {
      font-size: 1.65rem;
      font-weight: 800;
      margin: 0 0 6px 0;
      line-height: 1.25;
      color: #ffffff;
    }
    .biz-location {
      font-size: 0.95rem;
      color: #94a3b8;
      margin: 0 0 26px 0;
    }
    .actions-stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 15px 20px;
      border-radius: 14px;
      font-size: 1.02rem;
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    .action-btn:active {
      transform: scale(0.98);
    }
    .btn-google {
      background: linear-gradient(135deg, #d4af37 0%, #b89528 100%);
      color: #0b0f19;
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.25);
    }
    .btn-whatsapp {
      background: #25D366;
      color: #ffffff;
      box-shadow: 0 6px 20px rgba(37, 211, 102, 0.25);
    }
    .btn-instagram {
      background: linear-gradient(45deg, #f09433, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      color: #ffffff;
      box-shadow: 0 6px 20px rgba(220, 39, 67, 0.25);
    }
    .btn-icon {
      width: 22px;
      height: 22px;
      fill: currentColor;
      flex-shrink: 0;
    }
    .loading-spinner {
      color: #94a3b8;
      font-size: 0.95rem;
    }
    .footer-note {
      margin-top: 26px;
      font-size: 0.78rem;
      color: #64748b;
    }
    .footer-note a {
      color: #d4af37;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="landing-card" id="cardContainer">
    <!-- Loading State -->
    <div id="loadingView" class="loading-spinner">
      <span>Connecting to card...</span>
    </div>

    <!-- Ready State -->
    <div id="bizView" style="display: none;">
      <span class="brand-badge" id="cardCategory">Verified Business</span>
      <h1 class="biz-name" id="bizName">Business Name</h1>
      <p class="biz-location" id="bizLocation"></p>

      <div class="actions-stack">
        <!-- Google Review CTA (Always Visible) -->
        <a id="btnGoogle" class="action-btn btn-google" href="#" target="_blank" rel="noopener">
          <svg class="btn-icon" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm3.8 13.8a5.4 5.4 0 1 1 0-7.6l-1.5 1.5a3.3 3.3 0 1 0 0 4.6z"/></svg>
          Leave a Google Review
        </a>

        <!-- WhatsApp CTA (Rendered only if provided) -->
        <a id="btnWhatsapp" class="action-btn btn-whatsapp" href="#" target="_blank" rel="noopener" style="display: none;">
          <svg class="btn-icon" viewBox="0 0 24 24"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38c1.45.79 3.08 1.21 4.79 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2zm0 18.09c-1.49 0-2.95-.4-4.22-1.16l-.3-.18-3.13.82.84-3.05-.2-.31a8.03 8.03 0 0 1-1.23-4.3c0-4.44 3.61-8.06 8.05-8.06 2.15 0 4.18.84 5.7 2.37a7.99 7.99 0 0 1 2.35 5.69c0 4.45-3.62 8.06-8.06 8.06z"/></svg>
          Connect on WhatsApp
        </a>

        <!-- Instagram CTA (Rendered only if provided) -->
        <a id="btnInstagram" class="action-btn btn-instagram" href="#" target="_blank" rel="noopener" style="display: none;">
          <svg class="btn-icon" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zm0 10.162a3.999 3.999 0 1 1 0-7.998 3.999 3.999 0 0 1 0 7.998zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"/></svg>
          Visit Instagram
        </a>
      </div>

      <div class="footer-note">
        Powered by <a href="/">TapToReview.in</a>
      </div>
    </div>
  </div>

  <script>
    const supabaseUrl = 'https://zavspmqjmrinfxenbosz.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InphdnNwbXFqbXJpbmZ4ZW5ib3N6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0NTkzOTksImV4cCI6MjEwNDAzNTM5OX0.7K-EFRRgLmLOh8BltHDH0qh61TDLbLlzCjJ5jBMXCc8';
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

    async function routeTap() {
      const rawPath = window.location.pathname.replace(/^\/+|\/+$/g, '');
      if (!rawPath) {
        window.location.replace('/');
        return;
      }

      const segments = rawPath.split('/');
      let cardCode = null;

      // Extract card code from /r/19 or /19
      if (segments[0] === 'r' && segments[1] && /^\d+$/.test(segments[1])) {         cardCode = parseInt(segments[1], 10);       } else if (/^\d+$/.test(segments[0])) {
        cardCode = parseInt(segments[0], 10);
      }

      let bizData = null;

      if (cardCode !== null) {
        // Query card details via get_card_details RPC
        const { data, error } = await supabaseClient.rpc('get_card_details', { p_code: cardCode });

        // Unassigned or invalid card -> Route to activate
        if (error || !data || data.status === 'unregistered' || !data.destination_url) {
          window.location.replace(`/activate?code=${cardCode}`);
          return;
        }

        bizData = data;

        // Log tap for monthly leaderboard
        try {
          await supabaseClient.rpc('increment_tap', {
            client_slug: 'card-' + cardCode,
            client_platform: 'google'
          });
        } catch (err) {
          console.error('Tap count error:', err);
        }
      } else {
        // Older name-based slug (e.g., /hotel-shreedatta-pune)
        const { data, error } = await supabaseClient
          .from('clients')
          .select('business_name, city_location, category, destination_url, whatsapp_url, instagram_url')
          .eq('slug', rawPath)
          .eq('platform', 'google')
          .single();

        if (error || !data?.destination_url) {
          document.getElementById('cardContainer').innerHTML = '<h2>Business link not found.</h2>';
          return;
        }

        bizData = data;

        // Log tap for legacy slug
        try {
          await supabaseClient.rpc('increment_tap', {
            client_slug: rawPath,
            client_platform: 'google'
          });
        } catch (err) {
          console.error('Tap count error:', err);
        }
      }

      // Render business micro-landing page
      document.getElementById('bizName').textContent = bizData.business_name || 'Our Channels';
      document.getElementById('cardCategory').textContent = bizData.category || 'TapToReview';
      document.getElementById('bizLocation').textContent = bizData.city_location || '';
      document.getElementById('btnGoogle').href = bizData.destination_url;

      // Conditional WhatsApp Button
      if (bizData.whatsapp_url) {
        const waBtn = document.getElementById('btnWhatsapp');
        waBtn.href = bizData.whatsapp_url;
        waBtn.style.display = 'flex';
      }

      // Conditional Instagram Button
      if (bizData.instagram_url) {
        const igBtn = document.getElementById('btnInstagram');
        igBtn.href = bizData.instagram_url;
        igBtn.style.display = 'flex';
      }

      document.getElementById('loadingView').style.display = 'none';
      document.getElementById('bizView').style.display = 'block';
    }

    routeTap();
  </script>
</body>
</html>
