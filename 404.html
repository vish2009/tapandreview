<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect & Review — TapToReview.in</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="icon" href="/assets/taptoreview-logo.svg" type="image/svg+xml">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: radial-gradient(circle at top, #141c2b 0%, #0a0e17 100%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
    }
    .landing-card {
      width: 100%;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(212, 175, 55, 0.28);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 24px;
      padding: 34px 22px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .biz-name {
      font-size: 1.7rem;
      font-weight: 800;
      margin: 0 0 8px 0;
      line-height: 1.25;
      color: #ffffff;
      cursor: default;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    .biz-location {
      font-size: 0.95rem;
      color: #94a3b8;
      margin: 0 0 28px 0;
    }
    .actions-stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 15px 20px;
      border-radius: 14px;
      font-size: 1.02rem;
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    .action-btn:active {
      transform: scale(0.98);
    }
    .btn-google {
      background: linear-gradient(135deg, #d4af37 0%, #b89528 100%);
      color: #0b0f19;
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.25);
    }
    .btn-whatsapp {
      background: #25D366;
      color: #ffffff;
      box-shadow: 0 6px 20px rgba(37, 211, 102, 0.25);
    }
    .btn-instagram {
      background: linear-gradient(45deg, #f09433, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      color: #ffffff;
      box-shadow: 0 6px 20px rgba(220, 39, 67, 0.25);
    }
    .btn-icon {
      width: 22px;
      height: 22px;
      fill: currentColor;
      flex-shrink: 0;
    }
    .loading-spinner {
      color: #94a3b8;
      font-size: 0.95rem;
    }
    .footer-note {
      margin-top: 26px;
      font-size: 0.78rem;
      color: #64748b;
    }
    .footer-note a {
      color: #d4af37;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="landing-card" id="cardContainer">
    <!-- Loading State -->
    <div id="loadingView" class="loading-spinner">
      <span>Connecting to card...</span>
    </div>

    <!-- Ready State (Micro-Landing Page) -->
    <div id="bizView" style="display: none;">
      <h1 class="biz-name" id="bizName">Business Name</h1>
      <p class="biz-location" id="bizLocation"></p>

      <div class="actions-stack">
        <!-- Google Review CTA (Official Google 'G' Icon) -->
        <a id="btnGoogle" class="action-btn btn-google" href="#" target="_blank" rel="noopener">
          <svg class="btn-icon" viewBox="0 0 24 24">
            <path d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z"/>
          </svg>
          Leave a Google Review
        </a>

        <!-- WhatsApp CTA (Official WhatsApp Icon with Handset) -->
        <a id="btnWhatsapp" class="action-btn btn-whatsapp" href="#" target="_blank" rel="noopener" style="display: none;">
          <svg class="btn-icon" viewBox="0 0 24 24">
            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
          </svg>
          Connect on WhatsApp
        </a>

        <!-- Instagram CTA -->
        <a id="btnInstagram" class="action-btn btn-instagram" href="#" target="_blank" rel="noopener" style="display: none;">
          <svg class="btn-icon" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zm0 10.162a3.999 3.999 0 1 1 0-7.998 3.999 3.999 0 0 1 0 7.998zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"/></svg>
          Follow on Instagram
        </a>
      </div>

      <!-- Reseller white-label: powered-by link disabled
      <div class="footer-note">
        Powered by <a href="/">TapToReview.in</a>
      </div>
      -->
    </div>
  </div>

  <script>
    const supabaseUrl = 'https://zavspmqjmrinfxenbosz.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InphdnNwbXFqbXJpbmZ4ZW5ib3N6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0NTkzOTksImV4cCI6MjEwNDAzNTM5OX0.7K-EFRRgLmLOh8BltHDH0qh61TDLbLlzCjJ5jBMXCc8';
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

    async function routeTap() {
      const rawPath = window.location.pathname.replace(/^\/+|\/+$/g, '');
      if (!rawPath) {
        window.location.replace('/');
        return;
      }

      const segments = rawPath.split('/');
      let cardCode = null;

      // Extract card code from /r/19 or /19
      if (segments[0] === 'r' && segments[1] && /^\d+$/.test(segments[1])) {         cardCode = parseInt(segments[1], 10);       } else if (/^\d+$/.test(segments[0])) {
        cardCode = parseInt(segments[0], 10);
      }

      let bizData = null;

      if (cardCode !== null) {
        // Query card details via get_card_details RPC
        const { data, error } = await supabaseClient.rpc('get_card_details', { p_code: cardCode });

        // Unassigned or invalid card -> Route straight to activate
        if (error || !data || data.status === 'unregistered' || !data.destination_url) {
          window.location.replace(`/activate?code=${cardCode}`);
          return;
        }

        bizData = data;

        // Log tap for monthly leaderboard
        try {
          await supabaseClient.rpc('increment_tap', {
            client_slug: 'card-' + cardCode,
            client_platform: 'google'
          });
        } catch (err) {
          console.error('Tap count error:', err);
        }
      } else {
        // Older name-based slug (e.g., /hotel-shreedatta-pune)
        const { data, error } = await supabaseClient
          .from('clients')
          .select('business_name, city_location, category, destination_url, whatsapp_url, instagram_url')
          .eq('slug', rawPath)
          .eq('platform', 'google')
          .single();

        if (error || !data?.destination_url) {
          document.getElementById('cardContainer').innerHTML = '<h2>Business link not found.</h2>';
          return;
        }

        bizData = data;

        // Log tap for legacy slug
        try {
          await supabaseClient.rpc('increment_tap', {
            client_slug: rawPath,
            client_platform: 'google'
          });
        } catch (err) {
          console.error('Tap count error:', err);
        }
      }

      // Render business micro-landing page
      const bizTitleEl = document.getElementById('bizName');
      bizTitleEl.textContent = bizData.business_name || 'Our Channels';
      document.getElementById('bizLocation').textContent = bizData.city_location || '';
      document.getElementById('btnGoogle').href = bizData.destination_url;

      // Conditional WhatsApp Button
      if (bizData.whatsapp_url) {
        const waBtn = document.getElementById('btnWhatsapp');
        waBtn.href = bizData.whatsapp_url;
        waBtn.style.display = 'flex';
      }

      // Conditional Instagram Button
      if (bizData.instagram_url) {
        const igBtn = document.getElementById('btnInstagram');
        igBtn.href = bizData.instagram_url;
        igBtn.style.display = 'flex';
      }

      // Invisible triple-tap on business name to open reseller portal
      let tapCount = 0;
      let tapTimer = null;
      bizTitleEl.addEventListener('click', () => {
        tapCount++;
        clearTimeout(tapTimer);

        if (tapCount === 3) {
          if (cardCode !== null) {
            window.location.href = `/activate?code=${cardCode}`;
          } else {
            window.location.href = '/activate';
          }
          return;
        }

        tapTimer = setTimeout(() => {
          tapCount = 0;
        }, 1200);
      });

      document.getElementById('loadingView').style.display = 'none';
      document.getElementById('bizView').style.display = 'block';
    }

    routeTap();
  </script>
</body>
</html>
