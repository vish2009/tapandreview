<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Review...</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f9fafb;
      color: #111827;
    }
    .box { text-align: center; max-width: 400px; padding: 20px; }
    .spinner {
      width: 36px;
      height: 36px;
      border: 4px solid #e5e7eb;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <p id="status-msg">Opening Google Review page...</p>
  </div>

  <script>
    const supabaseUrl = 'https://zavspmqjmrinfxenbosz.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InphdnNwbXFqbXJpbmZ4ZW5ib3N6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0NTkzOTksImV4cCI6MjEwNDAzNTM5OX0.7K-EFRRgLmLOh8BltHDH0qh61TDLbLlzCjJ5jBMXCc8';
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

    async function handleRedirect() {
      const rawPath = window.location.pathname.replace(/^\/+|\/+$/g, '');
      if (!rawPath) {
        window.location.replace('/');
        return;
      }

      // Check if route matches /r/{number} or direct /{number}
      const segments = rawPath.split('/');
      let cardCode = null;

      if (segments[0] === 'r' && segments[1] && /^\d+$/.test(segments[1])) {         cardCode = parseInt(segments[1], 10);       } else if (/^\d+$/.test(segments[0])) {
        cardCode = parseInt(segments[0], 10);
      }

      if (cardCode !== null) {
        await handleCardCodeRedirect(cardCode);
      } else {
        await handleLegacySlugRedirect(rawPath);
      }
    }

    async function handleCardCodeRedirect(cardCode) {
      try {
        const { data, error } = await supabaseClient.rpc('get_card_details', { p_code: cardCode });

        if (error || !data || data.status === 'unregistered' || !data.destination_url) {
          // Unassigned/Deregistered card -> Route to activation
          window.location.replace(`/activate?code=${cardCode}`);
          return;
        }

        // Tap tracking for card
        const cardSlug = 'card-' + cardCode;
        try {
          await supabaseClient.rpc('increment_tap', {
            client_slug: cardSlug,
            client_platform: 'google'
          });
        } catch (err) {
          console.error('Failed to increment tap:', err);
        }

        window.location.replace(data.destination_url);
      } catch (err) {
        console.error('Resolution error:', err);
        document.querySelector('.box').innerHTML = '<h2>Card error. Please try again.</h2>';
      }
    }

    async function handleLegacySlugRedirect(slug) {
      try {
        const { data, error } = await supabaseClient
          .from('clients')
          .select('destination_url')
          .eq('slug', slug)
          .eq('platform', 'google')
          .single();

        if (error || !data?.destination_url) {
          document.querySelector('.box').innerHTML = '<h2>Business link not found.</h2>';
          return;
        }

        try {
          await supabaseClient.rpc('increment_tap', {
            client_slug: slug,
            client_platform: 'google'
          });
        } catch (err) {
          console.error('Failed to increment tap:', err);
        }

        window.location.replace(data.destination_url);
      } catch (err) {
        console.error('Legacy resolution error:', err);
        document.querySelector('.box').innerHTML = '<h2>Link not found.</h2>';
      }
    }

    handleRedirect();
  </script>
</body>
</html>
